# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: React.js - CI

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/reactjs--ci.yml
      - .node-version
      - reactjs/babel.config.json
      - reactjs/jest.config.js
      - reactjs/jest.setup.js
      - reactjs/package.json
      - reactjs/pnpm-lock.yaml
      - reactjs/pnpm-workspace.yaml
      - reactjs/**/*.js
      - reactjs/**/*.jsx
  pull_request:
    paths:
      - .github/workflows/reactjs--ci.yml
      - .node-version
      - reactjs/babel.config.json
      - reactjs/jest.config.js
      - reactjs/jest.setup.js
      - reactjs/package.json
      - reactjs/pnpm-lock.yaml
      - reactjs/pnpm-workspace.yaml
      - reactjs/**/*.js
      - reactjs/**/*.jsx

permissions:
  contents: read
  pull-requests: read

jobs:
  change-detection:
    runs-on: ubuntu-latest
    outputs:
      reactjs-changes: ${{ steps.change-detection.outputs.reactjs }}
    steps:
      - uses: actions/checkout@v7
      - name: Change Detection
        uses: dorny/paths-filter@v4
        id: change-detection
        with:
          filters: |
            reactjs:
              - .github/workflows/reactjs--ci.yml
              - .node-version
              - reactjs/babel.config.json
              - reactjs/jest.config.js
              - reactjs/jest.setup.js
              - reactjs/package.json
              - reactjs/pnpm-lock.yaml
              - reactjs/pnpm-workspace.yaml
              - reactjs/**/*.js
              - reactjs/**/*.jsx
  jest:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    needs: change-detection
    if: needs.change-detection.outputs.reactjs-changes == 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-nodejs
        with:
          working-directory: ./reactjs
      - name: Jest
        working-directory: ./reactjs
        env:
          TZ: 'Asia/Tokyo'
        run: pnpm exec jest
