# This workflow updates the npm package dependencies of the React.js
# application every day and opens a pull request when any dependency
# changes are detected.

name: React.js - Daily Dependencies Update

on:
  schedule:
    # 0:30 JST every day
    - cron: "30 15 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update_pnpm_package_dependencies:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-nodejs
        with:
          working-directory: ./reactjs
      - name: Update pnpm Package Dependencies in reactjs
        working-directory: ./reactjs
        run: |
          corepack use pnpm@latest
          pnpm update
      - name: Generate Pull Request Description
        env:
          BODY_PATH: ${{ runner.temp }}/pr_body.md
        run: |
          {
            cat <<'OVERVIEW'
          ## 1. Overview

          This pull request was created automatically by the React.js - Daily Dependencies Update workflow.
          It updates pnpm itself (pinning the new version to the packageManager field of reactjs/package.json), updates every pnpm package dependency to the latest version allowed by reactjs/package.json, regenerates reactjs/pnpm-lock.yaml, and mirrors the new pnpm version to the Environment section of reactjs/README.md and to the description field of reactjs/package.json:

          ~~~console
          corepack use pnpm@latest
          pnpm update
          ~~~

          ## 2. Key Changes & Differences
          OVERVIEW
            echo
            bash .github/scripts/dependency_report.sh pnpm reactjs/pnpm-lock.yaml reactjs/package.json Packages
            cat <<SUMMARY

          ## 3. Summary

          The pnpm version pinned in reactjs/package.json and all pnpm package dependencies in reactjs are now up to date.
          Please make sure that all CI workflows pass before merging this pull request.

          ## 4. References

          - [React.js - Daily Dependencies Update workflow run](https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)
          - [pnpm update documentation](https://pnpm.io/cli/update)
          - [npm](https://www.npmjs.com/)
          SUMMARY
          } > "$BODY_PATH"
      - name: Compute Timestamp
        run: echo "TIMESTAMP=$(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M:%S JST')" >> "$GITHUB_ENV"
      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v8
        with:
          sign-commits: true
          branch: hayat01sh1da/daily/update-reactjs-pnpm-package-dependencies
          delete-branch: true
          commit-message: "[Daily][React.js] Update pnpm Package Dependencies at ${{ env.TIMESTAMP }}"
          title: "[Daily][React.js] Update pnpm Package Dependencies"
          body-path: ${{ runner.temp }}/pr_body.md
          reviewers: hayat01sh1da
          assignees: hayat01sh1da
