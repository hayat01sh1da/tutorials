# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Vue.js - CI

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/vuejs--ci.yml
      - .node-version
      - vuejs/babel.config.json
      - vuejs/jest.config.js
      - vuejs/package.json
      - vuejs/pnpm-lock.yaml
      - vuejs/pnpm-workspace.yaml
      - vuejs/**/*.js
  pull_request:
    paths:
      - .github/workflows/vuejs--ci.yml
      - .node-version
      - vuejs/babel.config.json
      - vuejs/jest.config.js
      - vuejs/package.json
      - vuejs/pnpm-lock.yaml
      - vuejs/pnpm-workspace.yaml
      - vuejs/**/*.js

permissions:
  contents: read
  pull-requests: read

jobs:
  change-detection:
    runs-on: ubuntu-latest
    outputs:
      vuejs-changes: ${{ steps.change-detection.outputs.vuejs }}
    steps:
      - uses: actions/checkout@v7
      - name: Change Detection
        uses: dorny/paths-filter@v4
        id: change-detection
        with:
          filters: |
            vuejs:
              - .github/workflows/vuejs--ci.yml
              - .node-version
              - vuejs/babel.config.json
              - vuejs/jest.config.js
              - vuejs/package.json
              - vuejs/pnpm-lock.yaml
              - vuejs/pnpm-workspace.yaml
              - vuejs/**/*.js
  jest:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    needs: change-detection
    if: needs.change-detection.outputs.vuejs-changes == 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-nodejs
        with:
          working-directory: ./vuejs
      - name: Jest
        working-directory: ./vuejs
        env:
          TZ: 'Asia/Tokyo'
        run: pnpm exec jest
